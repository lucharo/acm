# Docs site. Build: `just docs-build` (strict). Preview: `just docs`.
# Zensical is a Python tool; it runs through uvx, so the Bun project needs no Python setup.
[project]
site_name = "ACM"
site_description = "A local editor where people and agents review one Markdown document together."
site_author = "Luis Chaves Rodriguez"
site_url = "https://acm.luischav.es/"
repo_url = "https://github.com/lucharo/acm"
repo_name = "lucharo/acm"
edit_uri = "edit/main/docs/"
extra_css = ["stylesheets/extra.css"]
# Not pages: CLI captures (included into pages), logo sources, the doc index (docs/README.md, shown when browsing docs/ on GitHub).
exclude_docs = """
snippets/
logos/
README.md
"""

nav = [
  { "ACM" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Reviewing" = "reviewing.md" },
  { "Agents" = "agents.md" },
  { "CLI reference" = "cli.md" },
  { "CriticMarkup syntax" = "syntax.md" },
  { "Troubleshooting" = "troubleshooting.md" },
  { "Maintainers" = "maintainers.md" },
]

[project.theme]
custom_dir = "overrides"
language = "en"
# The editor uses the system font stack (see extra.css), so load no web font.
font = false
logo = "assets/logo.png"
favicon = "assets/favicon.png"
features = [
  "content.action.edit",
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "black"
accent = "deep purple"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "deep purple"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/lucharo/acm"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.snippets.base_path = ["docs/snippets"]
pymdownx.snippets.check_paths = true
